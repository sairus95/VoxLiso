name: voxliso
description: "Lit les sous-titres affichés sur une télé ou un écran d'ordinateur et les dit à voix haute."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.2
  # Android : module Camera2, qui fournit de vraies images NV21 à ML Kit
  # (le module CameraX par défaut annonce « yuv420 » pour des données NV21).
  camera_android: any
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_language_id: ^0.15.1
  google_mlkit_translation: ^0.15.1
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.8.2
  shared_preferences: ^2.3.0
  # Achat unique « VoxLiso Plus » (Google Play Billing / StoreKit).
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dict/
