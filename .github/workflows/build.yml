# Compile l'application automatiquement sur GitHub (gratuit), sans rien
# installer sur votre ordinateur. L'APK Android est téléchargeable dans
# l'onglet « Actions » > dernière exécution > « Artifacts ».
name: Compiler l'application

on:
  push:
  workflow_dispatch:

jobs:
  bergamot:
    # Traducteur du téléphone (Bergamot, le traducteur de Firefox) : compilé
    # une fois (≈30 min), puis gardé en cache tant que native/bergamot/ ne
    # change pas. Android (dans l'APK) et Linux (pour les tests).
    strategy:
      matrix:
        platform: [android, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: native/bergamot/out/${{ matrix.platform }}/release
          key: bergamot-${{ matrix.platform }}-v1-${{ hashFiles('native/bergamot/**') }}
      - name: Outils
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Télécharger le moteur (mozilla/translations)
        if: steps.cache.outputs.cache-hit != 'true'
        run: native/bergamot/build/fetch-engine.sh native/bergamot/engine
      - name: Compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: native/bergamot/build/build.sh ${{ matrix.platform }} native/bergamot/engine
      - uses: actions/upload-artifact@v4
        with:
          name: libbergamot-${{ matrix.platform }}
          path: native/bergamot/out/${{ matrix.platform }}/release/
          if-no-files-found: error

  android:
    needs: bergamot
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour publier l'APK dans « Releases »
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ajouter Maven Central aux dépôts Gradle
        # Certains composants Kotlin d'outillage Flutter ne sont pas servis par
        # le portail des plugins Gradle : on autorise aussi Maven Central / Google.
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/depots.gradle <<'EOF'
          beforeSettings { settings ->
            settings.pluginManagement.repositories {
              gradlePluginPortal()
              mavenCentral()
              google()
            }
          }
          allprojects {
            buildscript { repositories { mavenCentral(); google() } }
          }
          EOF
      - name: Traducteur du téléphone (bibliothèques compilées par « bergamot »)
        uses: actions/download-artifact@v4
        with:
          pattern: libbergamot-*
          path: native/bergamot/lib
          merge-multiple: true
      - name: Générer les dossiers Android/iOS
        run: flutter create --platforms=android,ios --org com.voxliso --project-name voxliso .
      - name: Configurer (caméra, voix, versions minimales)
        run: |
          dart run tool/setup.dart
          grep -n -A4 "release {" android/app/build.gradle* || true
          grep -n "shrink" android/gradle.properties || true
      - run: flutter pub get
      - name: Tests de la logique des sous-titres (et vraie traduction avec Bergamot)
        env:
          BERGAMOT_LIB: ${{ github.workspace }}/native/bergamot/lib/libbergamot-linux-x64.so
        run: flutter test
      - name: Clé de signature fixe (mises à jour sans désinstaller)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 || vars.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Clé de signature fixe utilisée."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 absent : clé temporaire, il faudra désinstaller avant chaque mise à jour."
          fi
      - name: Compiler l'APK
        # Clés DeepL et Azure intégrées à l'APK : lues dans les secrets (vides s'ils n'existent pas).
        run: flutter build apk --release --dart-define=APP_VERSION=1.0.${{ github.run_number }} --dart-define=DEEPL_KEY=${{ secrets.DEEPL_KEY }} --dart-define=AZURE_TRANSLATOR_KEY=${{ secrets.AZURE_TRANSLATOR_KEY }} --dart-define=AZURE_TRANSLATOR_REGION=${{ secrets.AZURE_TRANSLATOR_REGION }}
      - uses: actions/upload-artifact@v4
        with:
          name: voxliso-android
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publier l'APK dans « Releases » (téléchargement direct sur le téléphone)
        if: github.ref == 'refs/heads/main'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk VoxLiso.apk
          gh release create "v1.0.${{ github.run_number }}" VoxLiso.apk \
            --title "VoxLiso 1.0.${{ github.run_number }}" \
            --notes "Ouvrez cette page sur votre téléphone Android et touchez VoxLiso.apk pour l'installer." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

  ios:
    # Vérifie que la version iPhone compile. Pour l'installer sur un iPhone,
    # il faut la signer avec un compte Apple (voir README).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --org com.voxliso --project-name voxliso .
      - run: dart run tool/setup.dart
      - run: flutter pub get
      - name: Compiler pour iPhone (sans signature)
        run: |
          if ! flutter build ios --release --no-codesign --dart-define=APP_VERSION=1.0.${{ github.run_number }} --verbose > ios-build.log 2>&1; then
            echo "----- Erreurs Xcode -----"
            grep -nE "error:|\*\* BUILD FAILED|Error \(Xcode\)|requires a development team|Signing for" ios-build.log | head -60
            echo "----- Fin du journal -----"
            tail -40 ios-build.log
            exit 1
          fi
