# Compile l'application automatiquement sur GitHub (gratuit), sans rien
# installer sur votre ordinateur. L'APK Android est téléchargeable dans
# l'onglet « Actions » > dernière exécution > « Artifacts ».
name: Compiler l'application

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour publier l'APK dans « Releases »
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ajouter Maven Central aux dépôts Gradle
        # Certains composants Kotlin d'outillage Flutter ne sont pas servis par
        # le portail des plugins Gradle : on autorise aussi Maven Central / Google.
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/depots.gradle <<'EOF'
          beforeSettings { settings ->
            settings.pluginManagement.repositories {
              gradlePluginPortal()
              mavenCentral()
              google()
            }
          }
          allprojects {
            buildscript { repositories { mavenCentral(); google() } }
          }
          EOF
      - name: Générer les dossiers Android/iOS
        run: flutter create --platforms=android,ios --org com.voxliso --project-name voxliso .
      - name: Configurer (caméra, voix, versions minimales)
        run: dart run tool/setup.dart
      - run: flutter pub get
      - name: Tests de la logique des sous-titres
        run: flutter test
      - name: Compiler l'APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: voxliso-android
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publier l'APK dans « Releases » (téléchargement direct sur le téléphone)
        if: github.ref == 'refs/heads/main'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk VoxLiso.apk
          gh release create "v1.0.${{ github.run_number }}" VoxLiso.apk \
            --title "VoxLiso 1.0.${{ github.run_number }}" \
            --notes "Ouvrez cette page sur votre téléphone Android et touchez VoxLiso.apk pour l'installer." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

  ios:
    # Vérifie que la version iPhone compile. Pour l'installer sur un iPhone,
    # il faut la signer avec un compte Apple (voir README).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --org com.voxliso --project-name voxliso .
      - run: dart run tool/setup.dart
      - run: flutter pub get
      - name: Compiler pour iPhone (sans signature)
        run: |
          if ! flutter build ios --release --no-codesign --verbose > ios-build.log 2>&1; then
            echo "----- Erreurs Xcode -----"
            grep -nE "error:|\*\* BUILD FAILED|Error \(Xcode\)|requires a development team|Signing for" ios-build.log | head -60
            echo "----- Fin du journal -----"
            tail -40 ios-build.log
            exit 1
          fi
