# Compile l'application automatiquement sur GitHub (gratuit), sans rien
# installer sur votre ordinateur. L'APK Android est téléchargeable dans
# l'onglet « Actions » > dernière exécution > « Artifacts ».
name: Compiler l'application

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour publier l'APK dans « Releases »
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ajouter Maven Central aux dépôts Gradle
        # Certains composants Kotlin d'outillage Flutter ne sont pas servis par
        # le portail des plugins Gradle : on autorise aussi Maven Central / Google.
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/depots.gradle <<'EOF'
          beforeSettings { settings ->
            settings.pluginManagement.repositories {
              gradlePluginPortal()
              mavenCentral()
              google()
            }
          }
          allprojects {
            buildscript { repositories { mavenCentral(); google() } }
          }
          EOF
      - name: Générer les dossiers Android/iOS
        run: flutter create --platforms=android,ios --org com.voxliso --project-name voxliso .
      - name: Configurer (caméra, voix, versions minimales)
        run: |
          dart run tool/setup.dart
          grep -n -A4 "release {" android/app/build.gradle* || true
          grep -n "shrink" android/gradle.properties || true
      - run: flutter pub get
      - name: Tests de la logique des sous-titres
        run: flutter test
      - name: Clé de signature fixe (mises à jour sans désinstaller)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 || vars.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Clé de signature fixe utilisée."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 absent : clé temporaire, il faudra désinstaller avant chaque mise à jour."
          fi
      - name: Compiler l'APK
        # APK publié sur GitHub : toutes les fonctions débloquées (pas de STORE_BUILD).
        run: >
          flutter build apk --release
          --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: voxliso-android
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Paquet pour le Play Store (AAB signé avec la clé d'envoi)
        # Secrets à créer : ANDROID_RELEASE_KEYSTORE_B64, ANDROID_RELEASE_PASSWORD,
        # ANDROID_RELEASE_ALIAS. Version boutique : VoxLiso Plus à acheter.
        env:
          RELEASE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          RELEASE_ALIAS: ${{ secrets.ANDROID_RELEASE_ALIAS }}
        run: |
          if [ -z "$RELEASE_B64" ] || [ -z "$RELEASE_PASSWORD" ]; then
            echo "::warning::Secrets ANDROID_RELEASE_* absents : pas de paquet Play Store."
            exit 0
          fi
          echo "$RELEASE_B64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$RELEASE_PASSWORD"
            echo "keyPassword=$RELEASE_PASSWORD"
            echo "keyAlias=${RELEASE_ALIAS:-upload}"
          } > android/key.properties
          flutter build appbundle --release \
            --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION=1.0.${{ github.run_number }} \
            --dart-define=STORE_BUILD=true
          rm -f android/key.properties android/app/upload.jks
          echo "PLAY_AAB=1" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: env.PLAY_AAB == '1'
        with:
          name: voxliso-play-store
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Publier l'APK dans « Releases » (téléchargement direct sur le téléphone)
        if: github.ref == 'refs/heads/main'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk VoxLiso.apk
          gh release create "v1.0.${{ github.run_number }}" VoxLiso.apk \
            --title "VoxLiso 1.0.${{ github.run_number }}" \
            --notes "Ouvrez cette page sur votre téléphone Android et touchez VoxLiso.apk pour l'installer." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

  ios:
    # Vérifie que la version iPhone compile. Pour l'installer sur un iPhone,
    # il faut la signer avec un compte Apple (voir README).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --org com.voxliso --project-name voxliso .
      - run: dart run tool/setup.dart
      - run: flutter pub get
      - name: Compiler pour iPhone (sans signature)
        run: |
          if ! flutter build ios --release --no-codesign --dart-define=APP_VERSION=1.0.${{ github.run_number }} --dart-define=STORE_BUILD=true --verbose > ios-build.log 2>&1; then
            echo "----- Erreurs Xcode -----"
            grep -nE "error:|\*\* BUILD FAILED|Error \(Xcode\)|requires a development team|Signing for" ios-build.log | head -60
            echo "----- Fin du journal -----"
            tail -40 ios-build.log
            exit 1
          fi
