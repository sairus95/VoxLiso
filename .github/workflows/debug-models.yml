# Temporaire : modèles de Mozilla en artefact, pour essayer le moteur hors CI.
name: Modèles (essai)
on:
  push:
    branches: [traduction-telephone]
    paths: [.github/workflows/debug-models.yml]
jobs:
  models:
    runs-on: ubuntu-24.04
    steps:
      - name: Télécharger fr-en, en-fr, de-en, en-de
        run: |
          python3 - <<'PY'
          import json, urllib.request, gzip, os
          reg = json.load(urllib.request.urlopen("https://storage.googleapis.com/moz-fx-translations-data--303e-prod-translations-data/db/models.json"))
          base = reg["baseUrl"]
          for pair in ["fr-en", "en-fr", "de-en", "en-de"]:
              entries = reg["models"][pair]
              e = next((x for x in entries if x.get("releaseStatus") == "Release Android"), None) or next(x for x in entries if x.get("releaseStatus") == "Release")
              os.makedirs(f"models/{pair}", exist_ok=True)
              for k, f in e["files"].items():
                  name = f["path"].rsplit("/", 1)[1][:-3]
                  data = gzip.decompress(urllib.request.urlopen(f"{base}/{f['path']}").read())
                  open(f"models/{pair}/{name}", "wb").write(data)
                  print(pair, k, name, len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: models/
          retention-days: 2
